version: '3.8'

services:
  backend-api:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      # Ánh xạ code Python để sửa backend cũng không cần build lại
      - ./backend:/app

  frontend-web:
    build: ./frontend
    ports:
      - "8081:80"
    volumes:
      # 1. Nạp file cấu hình Nginx (quan trọng để kết nối API)
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      
      # 2. HOT RELOAD: Ánh xạ thư mục frontend máy thật vào trong Docker
      # Sửa file HTML/CSS ở ngoài -> Docker cập nhật ngay lập tức
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend-api