<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chẩn Đoán Tiểu Đường</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-3">

<div class="container-lg">
    
    <div class="text-center mb-4 fade-in">
        <h2 id="mainTitle" class="text-teal fw-bolder text-uppercase mb-2" style="letter-spacing: 1px; cursor: pointer; transition: opacity 0.2s;" title="Nhấn để làm mới trang">
            <i class="fas fa-robot me-2"></i>Mô Hình AI Hỗ Trợ Chẩn Đoán Bệnh Tiểu Đường
        </h2>
    </div>

    <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="row g-0">
            
            <div class="col-12 col-lg-5 bg-white p-3 p-md-4 border-end">
                <h6 class="text-teal fw-bold mb-3 text-uppercase text-center text-lg-start">
                    <i class="fas fa-notes-medical me-2"></i>Thông tin bệnh nhân
                </h6>
                
                <form id="diagnosisForm">
                    <div class="row g-2">
                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-dark small mb-1">Giới tính</label>
                            <select class="form-select form-select-sm text-dark" id="gender" required>
                                <option value="Male">Nam</option>
                                <option value="Female">Nữ</option>
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-dark small mb-1">Tuổi</label>
                            <input type="number" class="form-control form-control-sm text-dark" id="age" min="0" max="120" required
                                 oninvalid="this.setCustomValidity('Vui lòng nhập tuổi từ 0 đến 120')"
                                  oninput="this.setCustomValidity('')">
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-dark small mb-1">Cao huyết áp</label>
                            <select class="form-select form-select-sm text-dark" id="hypertension" required>
                                <option value="0">Không</option>
                                <option value="1">Có</option>
                            </select>
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-dark small mb-1">Bệnh tim mạch</label>
                            <select class="form-select form-select-sm text-dark" id="heart_disease" required>
                                <option value="0">Không</option>
                                <option value="1">Có</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold text-dark small mb-1">Lịch sử hút thuốc</label>
                            <select class="form-select form-select-sm text-dark" id="smoking_history" required>
                                <option value="never">Chưa bao giờ</option>
                                <option value="former">Đã cai</option>
                                <option value="current">Đang hút</option>
                                <option value="No Info">Không có thông tin</option>
                            </select>
                        </div>

                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-dark small mb-1">
    BMI <i class="fas fa-question-circle text-secondary ms-1" style="font-size: 0.85em; cursor: help;" title="Chỉ số khối cơ thể. Tính bằng: Cân nặng(kg) / Chiều cao(m)². Mức bình thường: 18.5 - 24.9"></i>
</label>
                            <input type="number" step="0.1" class="form-control form-control-sm text-dark" id="bmi" placeholder="Ví dụ: 22.5" min="10" max="80" required
                                   oninvalid="this.setCustomValidity('Vui lòng nhập BMI hợp lệ (10 - 80)')"
                                   oninput="this.setCustomValidity('')">
                        </div>
                        <div class="col-sm-6">
                            <label class="form-label fw-bold text-dark small mb-1">
    HbA1c (%) <i class="fas fa-question-circle text-secondary ms-1" style="font-size: 0.85em; cursor: help;" title="Đường huyết trung bình trong 2-3 tháng qua. Mức an toàn: Dưới 5.7%"></i>
</label>
                            <input type="number" step="0.1" class="form-control form-control-sm text-dark" id="HbA1c_level" placeholder="Ví dụ: 5.5" min="3" max="20" required
                                   oninvalid="this.setCustomValidity('Chỉ số HbA1c không hợp lệ (3% - 20%)')"
                                   oninput="this.setCustomValidity('')">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold text-dark small mb-1">
    Đường huyết lúc đói (mg/dL) <i class="fas fa-question-circle text-secondary ms-1" style="font-size: 0.85em; cursor: help;" title="Đo vào buổi sáng, nhịn ăn ít nhất 8 tiếng. Mức an toàn: Dưới 100 mg/dL"></i>
</label>
                            <input type="number" class="form-control form-control-sm text-dark" id="blood_glucose_level" placeholder="Ví dụ: 120" min="40" max="600" required
                                   oninvalid="this.setCustomValidity('Đường huyết không hợp lệ (40 - 600 mg/dL)')"
                                   oninput="this.setCustomValidity('')">
                            <small class="text-muted fst-italic mt-1 d-block" style="font-size: 0.75rem;"><i class="fas fa-info-circle me-1"></i>* Đo vào buổi sáng, trước khi ăn.</small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 mt-3 py-2 fw-bold rounded-3 shadow-sm text-uppercase" id="submitBtn">
                        <i class="fas fa-bolt me-2"></i>Phân Tích Ngay
                    </button>
                </form>
            </div>

            <div class="col-12 col-lg-7 p-3 p-md-4 bg-light d-flex flex-column align-items-center justify-content-center text-center">
                
                <div id="initialState" class="fade-in w-100">
                    <i class="fas fa-user-md fa-3x text-muted opacity-25 mb-3"></i>
                    <h5 class="text-muted fw-bold opacity-50 mb-3">Sẵn Sàng Chẩn Đoán</h5>
                    
                    <div class="alert alert-warning bg-warning bg-opacity-10 border-warning border-opacity-25 mx-auto text-start p-2" style="max-width: 450px;">
                        <p class="mb-0 small text-warning-emphasis" style="font-size: 0.8rem;">
                            <i class="fas fa-exclamation-triangle me-1"></i><strong>Khuyến cáo:</strong> Mô hình AI chỉ mang tính chất tham khảo sàng lọc, <strong>hoàn toàn không thay thế</strong> chỉ định của bác sĩ.
                        </p>
                    </div>
                </div>

                <div id="resultState" class="d-none w-100 fade-in">
                    <div class="bg-white p-2 rounded-4 shadow-sm border mx-auto mb-3" style="max-width: 450px;">
                        <h5 id="resultText" class="fw-bold mb-1 mt-1"></h5>
                        <p id="resultDesc" class="text-muted mb-1" style="font-size: 0.85rem;"></p>
                    </div>
                    
                    <div class="position-relative mx-auto mb-3" style="height: 200px; width: 200px;">
                        <canvas id="riskChart"></canvas>
                        <div class="position-absolute top-50 start-50 translate-middle text-center">
                            <span class="text-muted small text-uppercase ls-1" style="font-size: 0.7rem;">Nguy cơ</span>
                            <h3 id="percentText" class="fw-bolder mb-0"></h3>
                        </div>
                    </div>

                    <button type="button" class="btn btn-sm btn-outline-secondary px-4 py-2 mt-1 rounded-pill fw-bold shadow-sm" id="resetBtn">
                        <i class="fas fa-redo-alt me-2"></i>Làm Mới
                    </button>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
